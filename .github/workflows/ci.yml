# Runs every test on each push and pull request. No secrets are needed: everything runs offline
# in sample mode (the backend tests mock SEC, Zetaris and the model providers).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Memory service (two watchlist tests run against the real H-MEM engine)
        working-directory: services/hmem-sidecar
        run: npm ci --no-audit --no-fund && npm run setup
      - run: pip install -e "backend[dev]" pyflakes
      - run: pyflakes backend/app backend/tests scripts
      - run: pytest -q
        working-directory: backend

  hmem:
    name: Memory service tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/hmem-sidecar } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: services/hmem-sidecar/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run setup # vendors the Meterless H-MEM reference engine
      - run: npm test

  frontend:
    name: Frontend unit tests and build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend-v2 } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend-v2/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end tests (browser)
    runs-on: ubuntu-latest
    needs: [backend, hmem, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Backend into backend/.venv (the path playwright.config.ts starts it from)
        run: python -m venv backend/.venv && backend/.venv/bin/pip install -q -e "backend[dev]"
      - name: Memory service
        working-directory: services/hmem-sidecar
        run: npm ci --no-audit --no-fund && npm run setup
      - name: Frontend and browser
        working-directory: frontend-v2
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - run: npm run test:e2e
        working-directory: frontend-v2
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: frontend-v2/playwright-report, retention-days: 7 }

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
